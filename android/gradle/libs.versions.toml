[versions]
# AGP 9 is not optional: current androidx (core-ktx 1.19.0 and up) refuses to
# build under AGP 8, so staying on 8.x would mean holding a dozen libraries
# back. Gradle 9.7 is the matching wrapper.
#
# KSP changed its versioning scheme at 2.3.0 -- it used to be
# "<kotlin>-<ksp>" (2.2.21-2.0.5) and is now standalone semver, i.e. KSP is no
# longer pinned to one Kotlin release. That is why 2.3.11 pairs with Kotlin 2.4.
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.11"
desugarJdkLibs = "2.1.5"

# SDK levels. compileSdk 37 is forced by androidx: core-ktx 1.19.0 and
# lifecycle 2.11.0 both refuse to be compiled against anything older.
# targetSdk stays at 36 on purpose -- it is what opts the app in to new runtime
# behaviour, and there is nothing in 37 this app wants. minSdk 26 gives
# java.time, adaptive icons and the notification channel APIs natively.
compileSdk = "37"
minSdk = "26"
targetSdk = "36"

coreKtx = "1.19.0"
appcompat = "1.7.1"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"
fragmentCompose = "1.8.9"

room = "2.8.4"
work = "2.11.2"
datastore = "1.2.1"

retrofit = "3.0.0"
okhttp = "5.4.0"
serialization = "1.11.0"
coroutines = "1.11.0"
coil = "3.5.0"
# Readium already pulls this in transitively, but a transitive dependency is only
# on the runtime classpath. The aligner compiles against it, so it is declared --
# pinned to the version Readium resolves, so there is one jsoup on the classpath.
jsoup = "1.22.2"

# The EPUB parser/renderer. Also brings media3 transitively, but Phase 4 compiles
# against media3 directly, so it is declared below rather than relied on.
readium = "3.3.0"
media3 = "1.11.0"

# Decompresses the bundled dictionary at first use -- zstd -19 shrinks it to
# roughly a third the size of the APK's own deflate compression, which is
# worth the native-library cost only because it's read once per install (see
# Dictionary.kt's own extractIfNeeded doc for the actual measured numbers).
# Confirmed live on a real device that 1.5.6-8's own Android-vs-desktop-Linux
# runtime detection misfires (it saw the underlying Linux kernel + aarch64 CPU
# and assumed generic desktop Linux, not Android's own, differently-linked
# aarch64 build) -- newest available, in case a later release fixed it.
zstd = "1.5.7-16"

junit = "4.13.2"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"

[libraries]
# Readium 3.x requires core library desugaring even above minSdk 26.
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Compose: the BOM sets every androidx.compose.* version, so those are unversioned.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
# Hosts Readium's EpubNavigatorFragment inside a Compose tree.
androidx-fragment-compose = { module = "androidx.fragment:fragment-compose", version.ref = "fragmentCompose" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "okhttp" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
# No zstd-jni alias here: both dependencies on it (app/build.gradle.kts) use
# raw coordinate notation instead, since each needs a different explicit
# artifact classifier (@aar vs @jar) that a plain catalog alias can't carry --
# see the comments at each of those two dependency declarations for why.

# Audiobook playback. media3-session is what provides the lockscreen and
# notification controls, and the headset/Bluetooth buttons, for free.
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

readium-shared = { module = "org.readium.kotlin-toolkit:readium-shared", version.ref = "readium" }
readium-streamer = { module = "org.readium.kotlin-toolkit:readium-streamer", version.ref = "readium" }
readium-navigator = { module = "org.readium.kotlin-toolkit:readium-navigator", version.ref = "readium" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Since Kotlin 2.0 the Compose compiler ships with Kotlin itself.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
