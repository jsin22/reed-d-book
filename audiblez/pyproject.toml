[project]
name = "audiblez"
version = "0.4.9"
description = "Generate audiobooks from e-books (epub to wav/m4b)"
authors = [
    { name = "Claudio Santini", email = "hireclaudio@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ebooklib (>=0.18,<0.19)",
    "soundfile (>=0.13.1,<0.14.0)",
    "pick (>=2.4.0,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "spacy (>=3.8.3,<4.0.0)",
    "kokoro (==0.9.4)",
    "misaki[zh] (>=0.9.2)",
    "tabulate (>=0.9.0,<0.10.0)",
    "epub-toc (>=1.0.0,<2.0.0)",
    "qwen-tts (>=0.1.1,<0.2.0)",
    # Multiprocessing for parallel chapter synthesis (core.py's
    # resolve_worker_count / _run_chapters_parallel). Not stdlib
    # multiprocessing: the reedd server runs this from inside a Celery
    # prefork worker, whose task-executing child is itself a daemonic
    # process, and stdlib forbids a daemonic process from having children of
    # its own ("daemonic processes are not allowed to have children").
    # billiard -- Celery's own maintained fork of multiprocessing, and
    # already a dependency of Celery itself -- keeps separate bookkeeping
    # that does not hit that restriction, precisely because it exists to let
    # Celery's own internals do exactly this.
    "billiard (>=4.2.0,<5.0.0)",
]
exclude = [
    "imgs",
    "test",
    "*.wav",
    "*.m4b",
    "cover",
    "chapters.txt"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Homepage = "https://claudio.uk/posts/epub-to-audiobook.html"
Documentation = "https://github.com/santinic/audiblez"
Repository = "https://github.com/santinic/audiblez"
Issues = "https://github.com/santinic/audiblez/issues"

[project.scripts]
audiblez = "audiblez.cli:cli_main"
audiblez-ui = "audiblez.ui:main"

[tool.poetry.group.dev.dependencies]
deptry = "^0.23.0"